services:
  - type: web
    name: arent-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.12.0
          - key: DATABASE_URL
    value: ${DATABASE_URL}
  - key: SECRET_KEY
    value: ${SECRET_KEY}
  - key: TELEGRAM_BOT_TOKEN
    value: ${TELEGRAM_BOT_TOKEN}
  - key: TELEGRAM_BOT_USERNAME
    value: ${TELEGRAM_BOT_USERNAME}
  - key: ALLOWED_HOSTS
    value: ${ALLOWED_HOSTS}
  - key: REDIS_URL
    value: ${REDIS_URL}

  - type: worker
    name: arent-telegram-bot
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_telegram_bot
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.12.0
          - key: DATABASE_URL
    value: ${DATABASE_URL}
  - key: SECRET_KEY
    value: ${SECRET_KEY}
  - key: TELEGRAM_BOT_TOKEN
    value: ${TELEGRAM_BOT_TOKEN}
  - key: TELEGRAM_BOT_USERNAME
    value: ${TELEGRAM_BOT_USERNAME}
  - key: ALLOWED_HOSTS
    value: ${ALLOWED_HOSTS}
  - key: REDIS_URL
    value: ${REDIS_URL}
